<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="64px" height="64px">
  <defs>
    <!-- Primary Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1fc3ff" />
      <stop offset="100%" stop-color="#00a8e8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#003e5c" flood-opacity="0.3" />
    </filter>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
  </defs>

  <!-- Main Round Icon Base -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGradient)" filter="url(#shadow)" />

  <!-- Inner Rim Accent -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />

  <!-- 2048 Text -->
  <text 
    x="256" 
    y="256" 
    font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Segoe UI', sans-serif" 
    font-size="136" 
    font-weight="800" 
    letter-spacing="-3"
    fill="url(#textGradient)" 
    text-anchor="middle" 
    dominant-baseline="central">2048</text>
</svg>
